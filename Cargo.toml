[package]
name = "O3DSP"
version = "0.1.0"
edition = "2021"

[lib]
name = "o3dsp"
crate-type = ["lib"]

[dependencies]
atomic_float = "1.0"
rand = { version = "0.8", features = ["small_rng"] }

[features]
default = []
dasp_support = ["dep:dasp"]

[dependencies.dasp]
version = "0.11"
optional = true
features = ["signal"]

[profile.release]
lto = "thin"
