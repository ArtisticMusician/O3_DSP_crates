[package]
name = "O3DSP"
version = "0.1.0"
edition = "2021"

[lib]
name = "o3dsp"
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", branch = "master" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", branch = "master" }
atomic_float = "1.0"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
lto = "thin"