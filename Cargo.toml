[package]
name = "O3DSP"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[lib]
name = "o3dsp"
crate-type = ["lib"]

[features]
default = []
dasp_support = ["dep:dasp"]

[dependencies.dasp]
version = "0.11"
optional = true
features = ["signal"]

[profile.release]
lto = "thin"
